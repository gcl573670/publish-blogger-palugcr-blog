name: Publish Arabic News to Blogger

on:
  schedule:
    # One run every 15 minutes -> rotates through all categories in a loop
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: publish-news
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run publisher
        run: node publisher.js
        env:
          BLOG_ID: ${{ secrets.BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          GNEWS_KEY: ${{ secrets.GNEWS_KEY }}
          NEWS_DATA_IO_KEY: ${{ secrets.NEWS_DATA_IO_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BLOG_STATUS: ${{ secrets.BLOG_STATUS }}
          MAX_NEWS_AGE_HOURS: ${{ secrets.MAX_NEWS_AGE_HOURS }}
          GNEWS_TIMEFRAME: ${{ secrets.GNEWS_TIMEFRAME }}
          SCHEDULE_MODE: ${{ secrets.SCHEDULE_MODE }}
          GOOGLE_INDEXING_KEY_JSON: ${{ secrets.GOOGLE_INDEXING_KEY_JSON }}